
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    :root {
        --primary-color: #38e8ff;
        --accent-color: #6585ff;
        --bg-dark: #080d19;
        --card-bg: rgba(19, 28, 48, 0.82);
        --card-hover: rgba(29, 43, 72, 0.96);
        --text-light: #e4ebfa;
        --text-muted: #94a3bd;
        --border-color: rgba(148, 163, 189, 0.16);
        --shadow-glow: 0 18px 50px rgba(0, 0, 0, 0.24);

        --color-purple: #c084fc;
        --color-blue: #38bdf8;
        --color-green: #22c55e;
        --color-red: #fb5368;
        --color-gold: #facc15;
        --color-white: #f8fafc;
    }

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
        scroll-padding-top: 100px;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont,
            'Segoe UI', Roboto, sans-serif;
        background:
            radial-gradient(ellipse at 8% 5%, rgba(37, 99, 235, 0.18), transparent 32%),
            radial-gradient(ellipse at 92% 20%, rgba(0, 220, 255, 0.10), transparent 30%),
            radial-gradient(ellipse at 50% 75%, rgba(99, 102, 241, 0.08), transparent 40%),
            linear-gradient(145deg, #070b14 0%, #0b1222 48%, #080d19 100%);
        background-color: var(--bg-dark);
        background-attachment: fixed;
        color: var(--text-light);
        margin: 0;
        padding: 0;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
    }

    /* Thanh đầu trang */
    header {
        background: rgba(8, 13, 25, 0.82);
        padding: 18px 5%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(56, 232, 255, 0.16);
        position: sticky;
        top: 0;
        z-index: 100;
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
    }

    .logo-container {
        display: flex;
        align-items: center;
        gap: 18px;
        min-width: 0;
    }

    .logo-container img {
        height: 46px;
        max-width: 80px;
        object-fit: contain;
        filter: drop-shadow(0 0 12px rgba(56, 232, 255, 0.25));
        transition: transform 0.3s ease;
    }

    .logo-container img:hover {
        transform: scale(1.06);
    }

    .logo-container h2 {
        margin: 0;
        font-size: clamp(0.85rem, 1.5vw, 1.2rem);
        line-height: 1.5;
        letter-spacing: 0.5px;
        background: linear-gradient(100deg, #ffffff 5%, #83edff 55%, #829aff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
    }

    nav a {
        color: var(--text-light);
        margin-left: 24px;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        transition: color 0.25s ease;
        position: relative;
        padding: 7px 0;
    }

    nav a:hover {
        color: var(--primary-color);
    }

    nav a::after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: 0;
        left: 0;
        background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        border-radius: 5px;
        transition: width 0.25s ease;
    }

    nav a:hover::after {
        width: 100%;
    }

    /* Khung nội dung chính */
    .container {
        width: min(1380px, 100%);
        margin: 44px auto;
        padding: 0 28px;
    }

    h2 {
        font-weight: 800;
        letter-spacing: -0.6px;
    }

    #analysis h2 {
        font-size: clamp(1.45rem, 2.5vw, 2rem);
        color: #f4f8ff;
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 48px;
        margin-bottom: 28px !important;
        text-shadow: 0 0 30px rgba(56, 232, 255, 0.10);
    }

    #analysis h2::before {
        content: '';
        display: inline-block;
        flex: 0 0 5px;
        width: 5px;
        height: 32px;
        background: linear-gradient(180deg, #38e8ff, #6585ff);
        border-radius: 10px;
        box-shadow: 0 0 18px rgba(56, 232, 255, 0.4);
    }

    /* Lưới biểu đồ */
    .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
        gap: 26px;
        margin-bottom: 56px;
        align-items: stretch;
    }

    /* Thẻ phân tích */
    .card {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        background: linear-gradient(
            145deg,
            rgba(22, 34, 58, 0.92),
            rgba(12, 20, 36, 0.94)
        );
        border-radius: 18px;
        padding: 26px;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-glow);
        transition:
            transform 0.35s ease,
            border-color 0.35s ease,
            box-shadow 0.35s ease,
            background 0.35s ease;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        min-width: 0;
    }

    .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 18%;
        width: 64%;
        height: 1px;
        background: linear-gradient(
            90deg,
            transparent,
            rgba(56, 232, 255, 0.65),
            transparent
        );
        opacity: 0.6;
        transition: opacity 0.3s ease;
        pointer-events: none;
    }

    .card::after {
        content: '';
        position: absolute;
        top: -100px;
        right: -100px;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: rgba(56, 232, 255, 0.045);
        filter: blur(45px);
        z-index: -1;
        pointer-events: none;
    }

    .card:hover {
        background: linear-gradient(
            145deg,
            rgba(29, 43, 72, 0.98),
            rgba(14, 25, 45, 0.98)
        );
        border-color: rgba(56, 232, 255, 0.42);
        transform: translateY(-7px);
        box-shadow:
            0 24px 50px rgba(0, 0, 0, 0.3),
            0 0 28px rgba(56, 232, 255, 0.06);
    }

    .card:hover::before {
        opacity: 1;
    }

    .card h3 {
        margin-top: 0;
        margin-bottom: 10px;
        color: #f1f6ff;
        font-size: 1.12rem;
        line-height: 1.5;
        font-weight: 700;
        border: none;
        padding: 0;
        display: block;
        letter-spacing: -0.2px;
    }

    .card p {
        margin: 0 0 22px;
        color: var(--text-muted);
        font-size: 0.89rem;
        line-height: 1.75;
        min-height: 3.1em;
    }

    .card img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 12px;
        margin-top: auto;
        border: 1px solid rgba(148, 163, 189, 0.14);
        background-color: #080d16;
        transition:
            border-color 0.3s ease,
            filter 0.3s ease;
    }

    .card:hover img {
        border-color: rgba(56, 232, 255, 0.32);
        filter: brightness(1.04);
    }

    /* Khu vực video */
    .video-container {
        position: relative;
        overflow: hidden;
        background:
            linear-gradient(135deg, rgba(22, 35, 59, 0.96), rgba(10, 17, 31, 0.97));
        border-radius: 22px;
        padding: clamp(22px, 4vw, 42px);
        border: 1px solid rgba(56, 232, 255, 0.20);
        margin-bottom: 52px;
        box-shadow:
            0 24px 70px rgba(0, 0, 0, 0.28),
            inset 0 1px 0 rgba(255, 255, 255, 0.035);
    }

    .video-container::before {
        content: '';
        position: absolute;
        top: -180px;
        right: -100px;
        width: 360px;
        height: 360px;
        border-radius: 50%;
        background: rgba(56, 232, 255, 0.07);
        filter: blur(80px);
        pointer-events: none;
    }

    .video-container h3 {
        position: relative;
        margin-top: 0;
        margin-bottom: 8px;
        font-size: clamp(1.25rem, 2.5vw, 1.7rem);
        color: #f4f8ff;
        font-weight: 800;
        letter-spacing: -0.5px;
    }

    .video-container > p {
        position: relative;
        color: var(--text-muted);
        font-size: 0.93rem;
        margin-top: 0;
        margin-bottom: 24px;
    }

    .video-container video {
        display: block;
        position: relative;
        width: 100%;
        max-height: 600px;
        border-radius: 14px;
        background-color: #05080e;
        border: 1px solid rgba(56, 232, 255, 0.20);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.32);
        outline: none;
    }

    .video-container video:focus-visible {
        outline: 2px solid var(--primary-color);
        outline-offset: 4px;
    }

    /* Bảng chú thích */
    .legend-box {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        gap: 14px 24px;
        background: rgba(5, 11, 22, 0.65);
        padding: 20px 22px;
        border-radius: 14px;
        margin-bottom: 24px;
        font-size: 0.86rem;
        border: 1px solid rgba(148, 163, 189, 0.13);
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #cbd7eb;
        font-weight: 500;
        transition: color 0.25s ease;
    }

    .legend-item:hover {
        color: #ffffff;
    }

    .color-dot {
        width: 10px;
        height: 10px;
        flex: 0 0 10px;
        border-radius: 50%;
        display: inline-block;
        box-shadow: 0 0 12px currentColor;
    }

    .legend-item:nth-child(1) .color-dot {
        background-color: var(--color-purple) !important;
        color: var(--color-purple);
    }

    .legend-item:nth-child(2) .color-dot {
        background-color: var(--color-blue) !important;
        color: var(--color-blue);
    }

    .legend-item:nth-child(3) .color-dot {
        background-color: var(--color-green) !important;
        color: var(--color-green);
    }

    .legend-item:nth-child(4) .color-dot {
        background-color: var(--color-red) !important;
        color: var(--color-red);
    }

    .legend-item:nth-child(5) .color-dot {
        background-color: var(--color-gold) !important;
        color: var(--color-gold);
    }

    .legend-item:nth-child(6) .color-dot {
        background-color: var(--color-white) !important;
        color: var(--color-white);
    }

    /* Chân trang */
    footer {
        position: relative;
        text-align: center;
        padding: 30px 20px;
        background: rgba(7, 12, 23, 0.86);
        border-top: 1px solid rgba(56, 232, 255, 0.15);
        font-size: 0.85rem;
        color: #8493ad;
        backdrop-filter: blur(16px);
    }

    footer p {
        margin: 0;
        line-height: 1.8;
    }

    /* Hiệu ứng xuất hiện nhẹ */
    @media (prefers-reduced-motion: no-preference) {
        .video-container,
        #analysis {
            animation: fadeUp 0.7s ease both;
        }

        .card {
            animation: fadeUp 0.6s ease both;
        }

        .card:nth-child(2) {
            animation-delay: 0.06s;
        }

        .card:nth-child(3) {
            animation-delay: 0.12s;
        }

        .card:nth-child(4) {
            animation-delay: 0.18s;
        }

        .card:nth-child(5) {
            animation-delay: 0.24s;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    }

    /* Tối ưu máy tính bảng */
    @media (max-width: 900px) {
        .container {
            margin: 30px auto;
            padding: 0 20px;
        }

        .dashboard-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .card {
            padding: 20px;
        }

        .logo-container {
            gap: 12px;
        }
    }

    /* Tối ưu điện thoại */
    @media (max-width: 600px) {
        header {
            padding: 14px 18px;
        }

        .logo-container {
            gap: 10px;
        }

        .logo-container img {
            height: 36px;
            max-width: 56px;
        }

        .logo-container h2 {
            font-size: 0.77rem;
            letter-spacing: 0;
        }

        .container {
            margin: 24px auto;
            padding: 0 14px;
        }

        #analysis h2 {
            font-size: 1.35rem;
            gap: 10px;
            margin-top: 34px;
        }

        .dashboard-grid {
            grid-template-columns: minmax(0, 1fr);
            gap: 18px;
            margin-bottom: 36px;
        }

        .card {
            padding: 20px;
            border-radius: 15px;
        }

        .card h3 {
            font-size: 1.05rem;
        }

        .card p {
            min-height: 0;
            margin-bottom: 18px;
        }

        .video-container {
            padding: 20px 15px;
            border-radius: 17px;
            margin-bottom: 36px;
        }

        .video-container h3 {
            font-size: 1.3rem;
        }

        .video-container > p {
            font-size: 0.85rem;
        }

        .legend-box {
            padding: 16px;
            gap: 12px 16px;
            font-size: 0.79rem;
        }

        .video-container video {
            border-radius: 10px;
        }

        footer {
            padding: 24px 16px;
            font-size: 0.8rem;
        }
    }

    /* Tôn trọng thiết lập giảm chuyển động của người dùng */
    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            scroll-behavior: auto !important;
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }
</style>
